# Datos de la edición que usan los emails de docs/emails/sender/content/ y los
# formularios de docs/forms/content/.
# En los textos se escriben como ${name}, por ejemplo ${price}.
# Mientras un valor empiece por "POR DEFINIR", build.mjs avisa al generar los emails.

year = "2027"
edition = "6ª"
# Id de la carpeta "PyCampES <year>" de Google Drive (el de su URL,
# drive.google.com/drive/folders/<id>). docs/forms/api.mjs solo cambia los
# formularios que están dentro de esta carpeta.
drive_folder = "10G2ER-vNniYRiOMUyIyvRi6MMAhgrdfk"
dates = "POR DEFINIR (puente de mayo o Semana Santa)"
venue = "POR DEFINIR"
# Enlace a Google Maps del venue (lo usan los formularios de inscripción y becas).
venue_maps_url = "POR DEFINIR"
price = "POR DEFINIR (300 o 350 €)"

# Pre-inscripción 2027 (campañas 01a y 01b): formulario de Google, fecha en la
# que se cierra y fecha límite para escribir con los siguientes pasos.
preregistration_form_url = "https://forms.gle/pr6gGaNjXotsgPDt8"
preregistration_deadline = "jueves 10 de diciembre"
preregistration_next_steps_date = "viernes 18 de diciembre"
# Grupo de Sender con quienes se pre-inscribieron (se importa a mano desde el
# formulario). Lo usan 01c y 01d.
preregistered_group = "Pre-inscritos 2027"
# Los pre-inscritos también rellenan el formulario de inscripción (tiene más
# campos) y solo después reciben su cupón. Día en que se les abre la
# inscripción (01c y 01g) y hasta cuándo dura su prioridad, antes de la
# preventa (02). Plan A: "lunes 11 de enero" y "martes 12 de enero" (02 sale
# el miércoles 13 y 03 el lunes 18). Plan B: "lunes 1 de febrero" y "martes 2
# de febrero" (02 el miércoles 3 y 03 el lunes 8).
preregistration_registration_date = "lunes 11 de enero"
preregistration_priority_until = "martes 12 de enero"

# Plan B (campañas 01d, 01e y 01f): pre-inscripción para Semana Santa en un
# venue cerca de Barcelona, si no se llega a unas 20 pre-inscripciones para mayo.
preregistration_b_form_url = "POR DEFINIR"
preregistration_b_price = "entre 300 y 350 €"
preregistration_b_deadline = "lunes 11 de enero"
preregistration_b_next_steps_date = "viernes 29 de enero"

# Formulario de Google para inscribirse en esta edición. Obligatorio para las
# campañas de apertura de inscripción (02 y 03).
registration_form_url = "POR DEFINIR"

# Último día para inscribirse. Lo anuncia 03d, que sale 40 días antes del
# evento: conviene que sea una o dos semanas después de ese envío, con margen
# para cerrar los números con el venue y el PyBus.
registration_deadline = "POR DEFINIR (ej. domingo 28 de marzo)"

# Segmento de Sender con quienes están en la Newsletter y todavía no se
# inscribieron (campo Estado vacío). Reciben el journey "No inscritos" (03a a
# 03d). Se crea a mano en Sender (Subscribers → Segments).
not_registered_segment = "No inscritos 2027"

# Formulario de becas. Opcional: si se deja "POR DEFINIR", los emails de
# inscripción no mencionan las becas.
scholarships_form_url = "POR DEFINIR"
# Fecha límite para responder a las solicitudes de beca (la usa el formulario
# de becas), por ejemplo "viernes 15 de enero".
scholarships_answer_date = "POR DEFINIR"

# Plazas disponibles.
max_attendees = "30"

# Grupos de Sender con quienes vinieron a ediciones anteriores, separados por
# comas. Reciben la preventa (02) antes que el resto. Al cerrar cada edición,
# añade su grupo aquí.
previous_attendees_groups = "Asistentes 2022, Asistentes 2023, Asistentes 2024, Asistentes 2025, Asistentes 2026"

# Enlace a la tienda de pretix.eu donde se compra la entrada con el cupón.
pretix_url = "POR DEFINIR"

# Plazos del flujo de pago (en días). Deben coincidir con las esperas del
# workflow "Inscritos sin pagar" en Sender: 3 + 3 + 1 = 7 días. El último
# aviso (06) sale el día antes de que venza la reserva y dice «mañana»: si
# cambia la última espera, cambia también ese texto.
payment_days = "7"
days_left_first_reminder = "4"

# Enlace de invitación al grupo de Telegram de asistentes de esta edición.
attendees_telegram_url = "POR DEFINIR"

contact_email = "pycampes@gmail.com"
faqs_url = "https://pycamp.es/faqs"
code_of_conduct_url = "https://pycamp.es/diversity"

# Fechas del evento en formato AAAA-MM-DD. schedule.mjs las usa para calcular
# cuándo se envía cada email previo y posterior al evento.
event_start = "POR DEFINIR"
event_end = "POR DEFINIR"

# Formulario de Google para proponer proyectos de esta edición.
projects_form_url = "POR DEFINIR"

# PyBus: transporte desde la ciudad hasta el venue.
pybus_city = "POR DEFINIR"
pybus_departure_date = "POR DEFINIR"
pybus_departure_time = "POR DEFINIR (ej. 10:30)"
pybus_meeting_point = "POR DEFINIR"
pybus_maps_url = "POR DEFINIR"
venue_arrival_time = "POR DEFINIR (ej. 11:30)"

# Después del evento.
photos_url = "POR DEFINIR"
survey_url = "POR DEFINIR"

# Camisetas (campaña 10): enlace al producto en pretix.eu, precio y fecha
# límite para pedirlas.
tshirts_url = "POR DEFINIR"
tshirts_price = "POR DEFINIR (ej. 10 €)"
tshirts_deadline = "POR DEFINIR (ej. 12 de marzo)"
